{% extends 'blog/base.html' %}

{% block content %}
    <section class="card">
        <h2>Confirm delete</h2>
        <p>Are you sure you want to delete this post? This cannot be undone.</p>
        <article style="background:#f7f7f7; padding:16px; border-radius:8px; margin:16px 0;">
            <p>{{ post.body|linebreaksbr }}</p>
            <div class="post-meta">Posted on {{ post.created_at|date:'M d, Y H:i' }}</div>
        </article>
        <form method="post">
            {% csrf_token %}
            <button class="button button-danger" type="submit">Delete post</button>
            <a class="button button-secondary" href="{% url 'index' %}">Cancel</a>
        </form>
    </section>
{% endblock %}
